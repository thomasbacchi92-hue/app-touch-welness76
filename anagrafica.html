<style>
  :root { 
      --bg-body: #0f172a; --bg-panel: #1e293b; --border-line: #334155; 
      --text-main: #f8fafc; --text-muted: #94a3b8; 
      --accent: #38bdf8; --gold: #fbbf24; --green: #10b981; --red: #ef4444; --purple: #a855f7;
  }
  :root.light-theme {
      --bg-body: #f8fafc; --bg-panel: #ffffff; --border-line: #e2e8f0;
      --text-main: #0f172a; --text-muted: #64748b;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: var(--bg-body); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: var(--text-main); }
  
  textarea { resize: none !important; }
  textarea::-webkit-resizer { display: none !important; opacity: 0 !important; visibility: hidden !important; -webkit-appearance: none !important; }
  ::-webkit-scrollbar-corner { background: transparent !important; display: none !important; }

  /* ZONA FILTRI (TOP BAR) IDENTICA A LISTA.HTML */
  .top-bar { 
      background: var(--bg-panel); 
      padding: 10px 15px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      border-bottom: 2px solid var(--border-line); 
      flex-shrink: 0; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
  }
  .filter-row { 
      display: flex; 
      gap: 12px; 
      width: 100%; 
      max-width: 1600px;
      margin: 0 auto;
      align-items: center; 
      justify-content: space-between;
      flex-wrap: nowrap; 
  }
  .search-box { 
      display: flex; align-items: center; background: var(--bg-body); padding: 0 12px; 
      border-radius: 6px; flex: 1; max-width: 450px; border: 1px solid var(--border-line); 
      transition: border-color 0.3s; height: 36px; box-sizing: border-box; 
  }
  .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3); }
  .search-box input { border: none; background: transparent; color: var(--text-main); font-size: 13px; outline: none; width: 100%; margin-left: 8px; }

  /* CONTENUTO PRINCIPALE E TABELLA IDENTICI A LISTA.HTML */
  .main-content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
  .list-container { width: 100%; max-width: 1600px; display: flex; flex-direction: column; gap: 15px; }

  .table-responsive { width: 100%; overflow-x: auto; background: var(--bg-panel); border-radius: 12px; border: 1px solid var(--border-line); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .compact-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
  .compact-table th { padding: 12px 15px; border-bottom: 2px solid var(--border-line); color: var(--text-muted); background: var(--bg-body); white-space: nowrap; font-size: 11px; font-weight: 900; text-transform: uppercase; position: sticky; top: 0; z-index: 2; }
  .compact-table td { padding: 12px 15px; border-bottom: 1px solid var(--border-line); color: var(--text-main); vertical-align: middle; transition: background-color 0.2s; }
  .compact-table tr:hover td { background-color: rgba(255,255,255,0.03); }

  .client-name { font-weight: 900; font-size: 14px; text-transform: uppercase; color: var(--text-main); cursor: pointer; transition: 0.2s; }
  .client-name:hover { color: var(--accent); }

  /* PAGINAZIONE */
  .pagination-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-panel); padding: 10px 15px; border-radius: 10px;
      border: 1px solid var(--border-line); box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      flex-wrap: wrap; gap: 10px;
  }
  .page-info { font-size: 12px; color: var(--text-muted); font-weight: bold; }
  .page-controls { display: flex; align-items: center; gap: 5px; }
  .page-btn {
      min-width: 32px; height: 32px; padding: 0 8px; border-radius: 6px;
      border: 1px solid var(--border-line); background: var(--bg-body);
      color: var(--text-main); font-size: 12px; font-weight: bold;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s;
  }
  .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .page-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 900; }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* STILI MODALE INTERNA */
  .form-input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--border-line); border-radius: 8px; font-size: 13px; outline:none; background: var(--bg-body); color: var(--text-main); transition:0.2s; box-sizing: border-box; }
  .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3); }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
  .data-table th { color: var(--text-muted); padding: 12px; border-bottom: 2px solid var(--border-line); font-size: 11px; text-transform: uppercase; background: var(--bg-panel); position: sticky; top:0; z-index:2;}
  .data-table td { padding: 12px; border-bottom: 1px solid var(--border-line); color: var(--text-main); vertical-align: middle;}
  .data-table tr { transition: 0.2s; }
  .data-table tr:hover { background: rgba(56, 189, 248, 0.05); }

  #toastBlue { visibility: hidden; min-width: 250px; background-color: var(--toast-blue, #2563eb); color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; right: 30px; bottom: 30px; z-index: 9999; font-size: 14px; font-weight: bold; opacity: 0; transition: 0.5s; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
  #toastBlue.show { visibility: visible; opacity: 1; bottom: 40px; }
</style>
<script>if(localStorage.getItem('tw_theme') === 'light') document.documentElement.classList.add('light-theme');</script>
